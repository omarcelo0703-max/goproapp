<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>GoPro Soccer Club — Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --rojo: #D62828;
    --rojo-oscuro: #A31E1E;
    --rojo-suave: #F6DADA;
    --carbon: #37312F;
    --carbon-2: #4A4340;
    --carbon-suave: #8A817D;
    --dorado: #F2B705;
    --dorado-suave: #FCEBB8;
    --crema: #FAF7F2;
    --crema-2: #F1ECE3;
    --blanco: #FFFFFF;
    --verde: #2F9E44;
    --verde-suave: #E1F5E6;
    --ambar: #E8890C;
    --ambar-suave: #FCEACB;
    --hielo: #2E86AB;
    --hielo-suave: #DCEEF6;
    --linea: #E7DFD3;
    --sombra: 0 8px 24px -8px rgba(55,49,47,0.18);
    --sombra-lg: 0 20px 50px -12px rgba(55,49,47,0.35);
    --radio: 14px;
  }
  *{box-sizing:border-box;}
  :root{ padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); }
  html{ scroll-padding-top:env(safe-area-inset-top, 0px); }
  html,body{margin:0;padding:0;}
  body{
    font-family:'Work Sans', sans-serif;
    background:var(--crema);
    color:var(--carbon);
    -webkit-font-smoothing:antialiased;
  }
  .eyebrow{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:12px;
    font-weight:600;
    color:var(--carbon-suave);
  }
  h1,h2,h3{
    font-family:'Anton', sans-serif;
    font-weight:400;
    letter-spacing:0.01em;
    margin:0;
  }
  /* subtle pitch-line texture on the app background */
  .app-shell{
    display:flex;
    min-height:100vh;
    background-image:
      repeating-linear-gradient(0deg, rgba(55,49,47,0.025) 0px, rgba(55,49,47,0.025) 1px, transparent 1px, transparent 84px);
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:250px;
    flex-shrink:0;
    background:var(--carbon);
    color:var(--crema);
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .sidebar-brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .sidebar-brand img{
    width:46px;
    height:46px;
    object-fit:contain;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4));
  }
  .sidebar-brand .club-name{
    font-family:'Anton', sans-serif;
    font-size:17px;
    line-height:1.05;
    letter-spacing:0.01em;
  }
  .sidebar-brand .club-sub{
    font-family:'Oswald', sans-serif;
    font-size:10.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--dorado);
    margin-top:3px;
  }
  .sidebar-nav{
    flex:1;
    padding:16px 12px;
    display:flex;
    flex-direction:column;
    gap:4px;
    overflow-y:auto;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 14px;
    border-radius:10px;
    color:rgba(250,247,242,0.72);
    cursor:pointer;
    font-family:'Oswald', sans-serif;
    font-size:14px;
    letter-spacing:0.03em;
    font-weight:500;
    border:none;
    background:transparent;
    text-align:left;
    width:100%;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item svg{ width:18px; height:18px; flex-shrink:0; opacity:0.9; }
  .nav-item:hover{ background:rgba(255,255,255,0.06); color:var(--crema); }
  .nav-item.active{ background:var(--rojo); color:#fff; }
  .nav-item.active svg{ opacity:1; }
  .sidebar-foot{
    padding:16px 20px 20px;
    border-top:1px solid rgba(255,255,255,0.08);
    font-family:'Oswald', sans-serif;
    font-size:11px;
    color:rgba(250,247,242,0.4);
    letter-spacing:0.05em;
  }

  /* mobile top bar */
  .topbar{ display:none; }

  /* ---------- MAIN ---------- */
  .main{
    flex:1;
    min-width:0;
    padding:32px 40px 60px;
  }
  .page-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .page-head h1{ font-size:32px; color:var(--carbon); }
  .page-head .sub{ font-size:14px; color:var(--carbon-suave); margin-top:6px; }
  .page-head .head-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  .btn{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:13.5px;
    letter-spacing:0.03em;
    padding:11px 20px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:transform .1s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn svg{ width:16px; height:16px; }
  .btn-primary{ background:var(--rojo); color:#fff; box-shadow:0 6px 16px -6px rgba(214,40,40,0.55); }
  .btn-primary:hover{ background:var(--rojo-oscuro); }
  .btn-ghost{ background:var(--blanco); color:var(--carbon); border:1px solid var(--linea); }
  .btn-ghost:hover{ background:var(--crema-2); }
  .btn-danger{ background:var(--blanco); color:var(--rojo-oscuro); border:1px solid var(--rojo-suave); }
  .btn-danger:hover{ background:var(--rojo-suave); }
  .btn-sm{ padding:8px 14px; font-size:12.5px; }
  .btn:active{ transform:scale(0.97); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }

  /* ---------- DASHBOARD ---------- */
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:18px;
    margin-bottom:32px;
  }
  .stat-card{
    background:var(--blanco);
    border-radius:var(--radio);
    padding:20px 22px;
    box-shadow:var(--sombra);
    border:1px solid var(--linea);
    position:relative;
    overflow:hidden;
  }
  .stat-card::before{
    content:"";
    position:absolute; top:0; left:0; width:5px; height:100%;
    background:var(--accent, var(--rojo));
  }
  .stat-card .num{ font-family:'Anton'; font-size:34px; color:var(--carbon); line-height:1; margin-top:8px;}
  .stat-card .lbl{ font-family:'Oswald'; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--carbon-suave); }

  .dash-columns{
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:22px;
  }
  .panel{
    background:var(--blanco);
    border-radius:var(--radio);
    border:1px solid var(--linea);
    box-shadow:var(--sombra);
    padding:22px 24px;
  }
  .panel h3{ font-size:19px; margin-bottom:14px; }
  .panel-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 0; border-bottom:1px solid var(--crema-2);
    font-size:14px;
  }
  .panel-row:last-child{ border-bottom:none; }

  .badge{
    font-family:'Oswald'; font-size:11px; font-weight:600; letter-spacing:0.05em;
    padding:4px 10px; border-radius:999px; text-transform:uppercase; white-space:nowrap;
  }
  .badge-verde{ background:var(--verde-suave); color:var(--verde); }
  .badge-ambar{ background:var(--ambar-suave); color:var(--ambar); }
  .badge-hielo{ background:var(--hielo-suave); color:var(--hielo); }

  /* ---------- CURSOS (shield cards - signature element) ---------- */
  .cursos-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
  }
  .curso-card{
    background:var(--carbon);
    color:var(--crema);
    border-radius:16px;
    padding:0;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    box-shadow:var(--sombra);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .curso-card:hover{ transform:translateY(-4px); box-shadow:var(--sombra-lg); }
  .curso-remove-btn{
    position:absolute; top:10px; right:10px; z-index:2;
    background:rgba(0,0,0,0.35); color:var(--crema);
  }
  .curso-remove-btn:hover{ background:var(--rojo); color:#fff; }
  .curso-card-add{
    background:transparent; border:2px dashed var(--linea); border-radius:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    min-height:190px; cursor:pointer; color:var(--carbon-suave);
    transition:all .15s ease;
  }
  .curso-card-add:hover{ border-color:var(--rojo); color:var(--rojo); background:var(--rojo-suave); }
  .curso-card-add svg{ width:28px; height:28px; }
  .curso-card-add span{ font-family:'Oswald'; font-size:13px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; }
  .curso-shield{
    height:96px;
    background:linear-gradient(160deg, var(--rojo) 0%, var(--rojo-oscuro) 100%);
    clip-path:polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%);
    display:flex; align-items:flex-start; justify-content:center; padding-top:16px;
  }
  .curso-shield svg{ width:34px; height:34px; opacity:0.92; }
  .curso-body{ padding:14px 20px 20px; margin-top:-6px; }
  .curso-body .cname{ font-family:'Anton'; font-size:20px; letter-spacing:0.01em; }
  .curso-body .cmeta{ font-family:'Oswald'; font-size:12px; color:rgba(250,247,242,0.6); margin-top:6px; letter-spacing:0.03em; }
  .curso-body .ccount{ font-family:'Anton'; font-size:28px; color:var(--dorado); margin-top:10px; }
  .curso-body .clabel{ font-family:'Oswald'; font-size:10.5px; text-transform:uppercase; letter-spacing:0.1em; color:rgba(250,247,242,0.5); }

  /* ---------- FILTERS / TOOLBAR ---------- */
  .toolbar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin-bottom:20px;
  }
  select, input[type=text], input[type=number], input[type=date], textarea{
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    border:1px solid var(--linea);
    border-radius:10px;
    padding:10px 14px;
    background:var(--blanco);
    color:var(--carbon);
    outline:none;
  }
  select:focus, input:focus, textarea:focus{ border-color:var(--rojo); box-shadow:0 0 0 3px rgba(214,40,40,0.12); }
  .search-wrap{ position:relative; flex:1; min-width:200px; max-width:340px; }
  .search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--carbon-suave); }
  .search-wrap input{ width:100%; padding-left:36px; }

  /* ---------- STUDENT LIST (jersey-number rows) ---------- */
  .student-list{
    background:var(--blanco);
    border-radius:var(--radio);
    border:1px solid var(--linea);
    overflow:hidden;
    box-shadow:var(--sombra);
  }
  .student-row{
    display:flex; align-items:center; gap:16px;
    padding:14px 20px;
    border-bottom:1px solid var(--crema-2);
    cursor:pointer;
    transition:background .12s ease;
  }
  .student-row:last-child{ border-bottom:none; }
  .student-row:hover{ background:var(--crema); }
  .jersey{
    width:38px; height:38px; border-radius:50%;
    background:var(--crema-2);
    color:var(--carbon-2);
    font-family:'Anton'; font-size:14px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    border:2px solid var(--linea);
  }
  .student-row .sname{ font-weight:600; font-size:15px; color:var(--carbon); }
  .student-row .smeta{ font-family:'Oswald'; font-size:11.5px; color:var(--carbon-suave); letter-spacing:0.03em; margin-top:2px; }
  .student-row .sright{ margin-left:auto; display:flex; align-items:center; gap:14px; }
  .student-row .curso-tag{ font-family:'Oswald'; font-size:11px; letter-spacing:0.04em; color:var(--carbon-suave); text-transform:uppercase; }
  .icon-btn{
    background:none; border:none; cursor:pointer; color:var(--carbon-suave);
    padding:7px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:background .12s ease, color .12s ease;
  }
  .icon-btn svg{ width:16px; height:16px; }
  .icon-btn:hover{ background:var(--rojo-suave); color:var(--rojo-oscuro); }
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--carbon-suave);
  }
  .empty-state svg{ width:44px; height:44px; margin-bottom:12px; opacity:0.4; }
  .empty-state .et{ font-family:'Anton'; font-size:18px; color:var(--carbon); margin-bottom:4px; }

  /* ---------- ATTENDANCE ---------- */
  .att-toolbar{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  .att-row{
    display:flex; align-items:center; gap:16px;
    padding:13px 20px; border-bottom:1px solid var(--crema-2);
  }
  .att-row:last-child{ border-bottom:none; }
  .att-toggle{
    margin-left:auto; display:flex; gap:6px;
  }
  .toggle-btn{
    font-family:'Oswald'; font-size:12px; font-weight:600; letter-spacing:0.04em;
    padding:8px 14px; border-radius:8px; border:1.5px solid var(--linea); background:var(--blanco);
    cursor:pointer; text-transform:uppercase; color:var(--carbon-suave);
    transition:all .12s ease;
  }
  .toggle-btn.present.active{ background:var(--verde-suave); border-color:var(--verde); color:var(--verde); }
  .toggle-btn.absent.active{ background:var(--rojo-suave); border-color:var(--rojo); color:var(--rojo-oscuro); }
  .att-summary{
    display:flex; gap:20px; margin-bottom:18px; flex-wrap:wrap;
  }
  .att-pill{
    font-family:'Oswald'; font-size:13px; font-weight:600; letter-spacing:0.03em;
    padding:9px 16px; border-radius:10px; background:var(--crema-2); color:var(--carbon-2);
  }

  /* ---------- PAGOS ---------- */
  .pago-row-wrap{ border-bottom:1px solid var(--crema-2); }
  .pago-row-wrap:last-child{ border-bottom:none; }
  .pago-row{
    display:flex; align-items:center; gap:16px; padding:14px 20px;
  }
  .pago-row .sright{ margin-left:auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end; }
  .pago-date{ font-family:'Oswald'; font-size:12px; color:var(--carbon-suave); letter-spacing:0.02em; }
  .pago-detail{
    display:none; padding:0 20px 16px 74px;
  }
  .pago-detail.show{ display:block; }
  .pago-detail label{ display:block; font-family:'Oswald'; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--carbon-suave); margin-bottom:6px; }
  .pago-detail input{ width:100%; max-width:320px; }

  /* ---------- FINANZAS ---------- */
  .fin-table{ display:flex; flex-direction:column; }
  .fin-table-head, .fin-table-row{
    display:grid; grid-template-columns:1.4fr 0.8fr 1fr 1fr 1fr 1fr 0.8fr;
    gap:8px; align-items:center; padding:11px 8px;
  }
  .fin-table-head{
    font-family:'Oswald'; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--carbon-suave);
    border-bottom:2px solid var(--linea);
  }
  .fin-table-row{ font-size:13.5px; border-bottom:1px solid var(--crema-2); border-radius:6px; }
  .fin-table-row:last-of-type{ border-bottom:none; }
  .fin-table-row .fin-curso{ font-family:'Oswald'; font-weight:600; letter-spacing:0.02em; padding-left:6px; }
  .fin-table-total{ font-weight:700; border-top:2px solid var(--linea); margin-top:4px; padding-top:13px; }

  .enc-group{ margin-bottom:26px; }
  .enc-group-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px; padding:0 2px;
  }
  .enc-group-head .gname{ font-family:'Anton'; font-size:17px; color:var(--carbon); }
  .enc-group-head .gcount{ font-family:'Oswald'; font-size:11.5px; color:var(--carbon-suave); letter-spacing:0.04em; margin-top:2px; }
  .enc-empty{
    padding:18px 20px; color:var(--carbon-suave); font-size:13.5px; font-style:italic;
    background:var(--blanco); border:1px dashed var(--linea); border-radius:12px;
  }

  /* ---------- MODAL ---------- */
  .modal-backdrop{
    display:none;
    position:fixed; inset:0; background:rgba(55,49,47,0.55);
    align-items:center; justify-content:center; z-index:100;
    padding:20px;
    backdrop-filter:blur(2px);
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:var(--blanco); border-radius:18px; width:100%; max-width:480px;
    max-height:88vh; overflow-y:auto;
    box-shadow:var(--sombra-lg);
    animation:modalIn .18s ease;
  }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(10px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 24px; border-bottom:1px solid var(--linea);
    position:sticky; top:0; background:var(--blanco); z-index:2;
  }
  .modal-head h3{ font-size:19px; }
  .modal-close{ background:none; border:none; cursor:pointer; color:var(--carbon-suave); padding:6px; border-radius:8px; }
  .modal-close:hover{ background:var(--crema-2); }
  .modal-body{ padding:22px 24px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-family:'Oswald'; font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--carbon-suave); margin-bottom:6px; }
  .field input, .field select, .field textarea{ width:100%; }
  .field textarea{ resize:vertical; min-height:70px; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .modal-foot{
    padding:16px 24px 22px; display:flex; gap:10px; justify-content:flex-end;
    border-top:1px solid var(--linea); position:sticky; bottom:0; background:var(--blanco);
  }
  .status-pick{ display:flex; gap:8px; flex-wrap:wrap; }
  .curso-check-group{ display:flex; flex-direction:column; gap:8px; }
  .curso-check{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    border:1.5px solid var(--linea); border-radius:10px; cursor:pointer;
    font-size:14px; transition:all .12s ease;
  }
  .curso-check input{ width:16px; height:16px; accent-color:var(--rojo); cursor:pointer; }
  .curso-check.checked{ border-color:var(--rojo); background:var(--rojo-suave); }
  .status-opt{
    flex:1; min-width:100px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--linea);
    cursor:pointer; text-align:center; font-family:'Oswald'; font-size:12px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color:var(--carbon-suave);
  }
  .status-opt.sel-verde.active{ background:var(--verde-suave); border-color:var(--verde); color:var(--verde); }
  .status-opt.sel-ambar.active{ background:var(--ambar-suave); border-color:var(--ambar); color:var(--ambar); }
  .status-opt.sel-hielo.active{ background:var(--hielo-suave); border-color:var(--hielo); color:var(--hielo); }

  .freeze-box{
    background:var(--hielo-suave); border-radius:10px; padding:14px 16px; margin-top:6px;
    display:none;
  }
  .freeze-box.show{ display:block; }

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--carbon); color:var(--crema); padding:13px 22px; border-radius:10px;
    font-family:'Oswald'; font-size:13px; letter-spacing:0.03em; box-shadow:var(--sombra-lg);
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:200;
    display:flex; align-items:center; gap:10px;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast svg{ width:16px; height:16px; color:var(--dorado); flex-shrink:0; }

  .confirm-box{ max-width:380px; }
  .confirm-box .modal-body{ text-align:center; padding-top:8px; }
  .confirm-box .warn-icon{ width:48px; height:48px; color:var(--rojo); margin:0 auto 14px; }

  @media (max-width: 980px){
    .stat-grid{ grid-template-columns:repeat(2, 1fr); }
    .cursos-grid{ grid-template-columns:repeat(2, 1fr); }
    .dash-columns{ grid-template-columns:1fr; }
  }
  @media (max-width: 760px){
    .app-shell{ flex-direction:column; }
    .sidebar{ display:none; }
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      background:var(--carbon); color:var(--crema); padding:calc(14px + env(safe-area-inset-top, 0px)) 18px 14px; position:sticky; top:0; z-index:50;
    }
    .topbar .tb-left{ display:flex; align-items:center; gap:10px; }
    .topbar img{ width:34px; height:34px; }
    .topbar .club-name{ font-family:'Anton'; font-size:15px; }
    .topbar button{ background:none; border:none; color:var(--crema); cursor:pointer; }
    .mobile-nav{
      display:none; flex-direction:column; background:var(--carbon); padding:10px 12px 16px;
    }
    .mobile-nav.open{ display:flex; }
    .main{ padding:22px 16px 50px; }
    .page-head h1{ font-size:26px; }
    .stat-grid{ grid-template-columns:1fr 1fr; gap:12px; }
    .cursos-grid{ grid-template-columns:1fr; }
    .field-row{ flex-direction:column; gap:0; }
    .fin-table-head{ display:none; }
    .fin-table-row{ grid-template-columns:1fr 1fr; grid-auto-rows:auto; row-gap:4px; padding:12px 8px; }
    .fin-table-row .fin-curso{ grid-column:1/-1; font-size:15px; }
    .pago-detail{ padding-left:20px; }
  }

  /* ---------- ACCESO ---------- */
  .auth-screen{
    position:fixed; inset:0; z-index:300; background:var(--carbon);
    display:flex; align-items:center; justify-content:center;
    padding:max(24px, env(safe-area-inset-top, 0px)) 24px max(24px, env(safe-area-inset-bottom, 0px));
    overflow:auto;
  }
  .auth-box{ width:100%; max-width:340px; display:flex; flex-direction:column; align-items:center; gap:30px; }
  .auth-logo{ width:min(230px, 58vw); height:auto; border-radius:26px; box-shadow:0 18px 50px rgba(0,0,0,0.5); background:#f4f4f4; }
  .auth-form{ width:100%; display:flex; flex-direction:column; gap:7px; }
  .auth-form label{ font-family:'Oswald', sans-serif; font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase; color:rgba(250,247,242,0.65); margin-top:6px; }
  .auth-form input{ width:100%; font-size:16px; padding:13px 14px; border-radius:11px; border:1.5px solid transparent; background:var(--crema); color:var(--carbon); }
  .auth-form input:focus{ border-color:var(--dorado); box-shadow:0 0 0 3px rgba(242,183,5,0.25); }
  .auth-btn{ width:100%; justify-content:center; margin-top:10px; padding:14px 20px; font-size:15px; }
  .auth-error{ min-height:18px; font-size:13px; color:#FFB4B4; margin-top:4px; }
  .user-name{ font-family:'Oswald', sans-serif; font-size:13px; color:rgba(250,247,242,0.85); letter-spacing:0.03em; margin-bottom:8px; word-break:break-word; }
  .user-actions{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
  .link-btn{ background:none; border:none; padding:0; cursor:pointer; font-family:'Oswald', sans-serif; font-size:12px; letter-spacing:0.04em; color:rgba(250,247,242,0.6); text-decoration:underline; text-underline-offset:3px; }
  .link-btn:hover{ color:var(--dorado); }
</style>
</head>
<body>

<!-- PANTALLA DE ACCESO: solo el escudo y el formulario -->
<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <img id="authLogo" class="auth-logo" alt="GoPro Soccer Club">
    <form id="loginForm" class="auth-form">
      <label for="loginUser">Usuario</label>
      <input id="loginUser" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <label for="loginPass">Contraseña</label>
      <input id="loginPass" name="password" type="password" autocomplete="current-password" required>
      <div id="loginError" class="auth-error" role="alert"></div>
      <button type="submit" class="btn btn-primary auth-btn" id="loginBtn">Entrar</button>
    </form>
    <form id="setupForm" class="auth-form" style="display:none;" autocomplete="off">
      <label for="setupToken">Código de configuración</label>
      <input id="setupToken" type="password" autocomplete="off" required>
      <label for="setupUser">Usuario administrador</label>
      <input id="setupUser" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required>
      <label for="setupPass">Contraseña nueva</label>
      <input id="setupPass" type="password" autocomplete="new-password" required>
      <label for="setupPass2">Repetir contraseña</label>
      <input id="setupPass2" type="password" autocomplete="new-password" required>
      <div id="setupError" class="auth-error" role="alert"></div>
      <button type="submit" class="btn btn-primary auth-btn" id="setupBtn">Crear administrador</button>
    </form>
  </div>
</div>

// Fechas con la hora LOCAL del dispositivo (con toISOString() pasadas las 8 pm en Bolivia ya cambiaba al día siguiente)
function pad2(n){ return String(n).padStart(2,'0'); }
function isoLocal(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayISO(){ return isoLocal(new Date()); }
function daysAgoISO(n){ const d = new Date(); d.setDate(d.getDate()-n); return isoLocal(d); }
function currentMonthKey(){ return todayISO().slice(0,7); } // YYYY-MM
function addMonths(monthKey, delta){
  const [y,m] = monthKey.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function fmtMonthLabel(monthKey){
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const [y,m] = monthKey.split('-').map(Number);
  return `${meses[m-1]} ${y}`;
}
function fmtMoney(n){
  return 'Bs ' + (Number(n)||0).toLocaleString('es-BO', {minimumFractionDigits:0, maximumFractionDigits:2});
}

/* ---------- Payment ledger helpers ---------- */
function getPago(studentId, monthKey){
  return pagos[studentId+'|'+monthKey] || {estado:'pendiente', fechaPago:null, motivo:''};
}
function setPago(studentId, monthKey, data){
  const key = studentId+'|'+monthKey;
  pagos[key] = Object.assign({estado:'pendiente', fechaPago:null, motivo:''}, getPago(studentId, monthKey), data);
}

/* ---------- Persistence: todo vive en el servidor (Netlify Blobs), detrás del login ---------- */
let pendingPatch = {};
let saveTimer = null;
let saving = false;
let dataVersion = null;

function isPlainObject(v){
  return v && typeof v === 'object' && !Array.isArray(v);
}
function deepMergeInto(target, source){
  for(const key in source){
    if(isPlainObject(source[key]) && isPlainObject(target[key])){
      deepMergeInto(target[key], source[key]);
    } else {
      target[key] = source[key];
    }
  }
}

function currentState(){
  return { students, encargados, attendance, encargadoAttendance, pagos, cursos: CURSOS, nextId, nextEncargadoId };
}

function showConnBanner(show){
  const b = document.getElementById('dbWarningBanner');
  if(b) b.style.display = show ? 'block' : 'none';
}

// Llama a nuestro servidor. Si la sesión venció (401), vuelve a la pantalla de acceso.
async function api(path, {method='GET', body, noExpire=false} = {}){
  let res;
  try{
    res = await fetch(path, {
      method,
      headers: body !== undefined ? {'Content-Type':'application/json'} : {},
      body: body !== undefined ? JSON.stringify(body) : undefined,
      credentials: 'same-origin',
      cache: 'no-store'
    });
  } catch(e){
    const err = new Error('Sin conexión con el servidor');
    err.network = true;
    throw err;
  }
  let data = null;
  try{ data = await res.json(); } catch(e){ /* sin cuerpo */ }
  if(!res.ok){
    const err = new Error((data && data.error) || ('Error '+res.status));
    err.status = res.status;
    if(res.status === 401 && !noExpire) onSessionExpired();
    throw err;
  }
  return data;
}

// patch: p. ej. {pagos: {"2|2026-09": {...}}} — solo lo que cambió.
// Alumnos y encargados se guardan como operaciones sueltas (ver listOp), nunca la lista entera.
// El servidor lo fusiona con lo último guardado, así dos personas no se pisan.
function mergePatchInto(target, source){
  const {listOps, ...rest} = source;
  deepMergeInto(target, rest);
  if(listOps){
    target.listOps = target.listOps || {};
    for(const k in listOps){
      target.listOps[k] = (target.listOps[k] || []).concat(listOps[k]);
    }
  }
  return target;
}
// Operaciones sobre una lista: op = 'add' | 'update' (con el elemento) o 'remove' (con el id)
function listOp(list, op, itemOrId){
  const o = op === 'remove' ? {op, id: itemOrId} : {op, item: itemOrId};
  return {listOps: {[list]: [o]}};
}
function listOps(list, op, items){
  return {listOps: {[list]: items.map(it=>({op, item: it}))}};
}
// Id nuevo al azar (no secuencial): dos personas creando a la vez no pueden obtener el mismo
function newId(list){
  const used = new Set(list.map(x=>x.id));
  let id;
  do { id = 100000 + Math.floor(Math.random() * 2000000000); } while(used.has(id));
  return id;
}

function queueSave(patch){
  // se copia: así lo que queda en cola no cambia si el objeto se sigue editando en pantalla
  mergePatchInto(pendingPatch, JSON.parse(JSON.stringify(patch)));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 150);
}

async function flushSave(){
  if(saving){ saveTimer = setTimeout(flushSave, 250); return; }
  if(Object.keys(pendingPatch).length === 0) return;
  const patch = pendingPatch;
  pendingPatch = {};
  saving = true;
  try{
    await api('/api/data', {method:'POST', body:{patch}});
    showConnBanner(false);
    showToast('Guardado ✓');
  } catch(err){
    if(err.status === 401){
      // la sesión venció: onSessionExpired ya mostró la pantalla de acceso
    } else if(err.status && err.status < 500 && err.status !== 409){
      showToast('No se pudo guardar: ' + err.message); // el servidor lo rechazó: no tiene sentido reintentar
    } else {
      // sin conexión o error temporal: conservamos el cambio y reintentamos
      pendingPatch = mergePatchInto(patch, pendingPatch);
      showConnBanner(true);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flushSave, 5000);
    }
  } finally {
    saving = false;
  }
}

// Descarga un archivo (Excel, respaldo)
async function saveBlobFile(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  return true;
}

async function downloadBackup(){
  try{
    const payload = { app:'gopro-soccer-club', version:1, exportedAt:new Date().toISOString(), state: currentState() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const ok = await saveBlobFile(blob, `respaldo-gopro_${todayISO()}.json`);
    if(ok) showToast('Respaldo descargado');
  } catch(err){
    console.error('Error al descargar el respaldo:', err);
    showToast('No se pudo generar el respaldo');
  }
}

// Carga un estado (del servidor o de un respaldo). Siempre se clona: la app modifica sus datos en el lugar.
function applyState(raw){
  const data = JSON.parse(JSON.stringify(raw));
  students = data.students || [];
  encargados = data.encargados || [];
  attendance = data.attendance || {};
  encargadoAttendance = data.encargadoAttendance || {};
  pagos = data.pagos || {};
  CURSOS = (data.cursos && data.cursos.length) ? data.cursos : ["CAR Noche","CAR Tarde","EF","KIDS"];
  nextId = data.nextId || (Math.max(0, ...students.map(s=>s.id)) + 1);
  nextEncargadoId = data.nextEncargadoId || (Math.max(0, ...encargados.map(e=>e.id)) + 1);
  if(typeof state !== 'undefined' && !CURSOS.includes(state.attCurso)) state.attCurso = CURSOS[0];
  migrateEncargadosToMultiCurso();
}

async function loadData(){
  const r = await api('/api/data');
  if(r.exists && r.state){
    applyState(r.state);
    dataVersion = r.version;
  } else {
    seedInitialRoster(); // todavía no hay datos en el servidor: empieza vacío
    dataVersion = null;
  }
}

// One-time migration: old shape was one encargado = one curso (`{curso}` + attendance key `id|date`).
// New shape lets an encargado cover several cursos (`{cursos:[...]}` + attendance key `id|curso|date`).
function migrateEncargadosToMultiCurso(){
  let changed = false;
  encargados.forEach(e=>{
    if(!e.cursos){
      e.cursos = e.curso ? [e.curso] : [];
      delete e.curso;
      changed = true;
    }
  });
  const oldKeys = Object.keys(encargadoAttendance).filter(k=>k.split('|').length===2);
  if(oldKeys.length){
    oldKeys.forEach(k=>{
      const [encId, date] = k.split('|');
      const enc = encargados.find(e=>e.id===parseInt(encId));
      const curso = enc && enc.cursos[0];
      if(curso){
        encargadoAttendance[encId+'|'+curso+'|'+date] = encargadoAttendance[k];
      }
      delete encargadoAttendance[k];
    });
    changed = true;
  }
  if(changed) queueSave({...listOps('encargados', 'update', encargados), encargadoAttendance});
}

function seedInitialRoster(){
  students = []; encargados = []; attendance = {}; encargadoAttendance = {}; pagos = {};
  nextId = 1; nextEncargadoId = 1;
  SEED_STUDENTS.forEach(sd=>{
    const id = nextId++;
    students.push({
      id, nombre: sd.nombre, apellidoPaterno: sd.apellidoPaterno, apellidoMaterno: sd.apellidoMaterno,
      edad: sd.edad, curso: sd.curso, montoMensual: sd.montoMensual, becaPorcentaje: sd.becaPorcentaje||0,
      apoderado: sd.apoderado||'', telefono: sd.telefono||'', observaciones: sd.observaciones||''
    });
    if(sd._pagoActual){
      setPago(id, SEED_MONTH, sd._pagoActual);
    }
  });
}

/* ============================ HELPERS ============================ */
function sortStudents(list){
  return [...list].sort((a,b)=>{
    const ap = a.apellidoPaterno.localeCompare(b.apellidoPaterno,'es');
    if(ap!==0) return ap;
    const am = a.apellidoMaterno.localeCompare(b.apellidoMaterno,'es');
    if(am!==0) return am;
    return a.nombre.localeCompare(b.nombre,'es');
  });
}
function fullName(s){ return `${s.nombre} ${s.apellidoPaterno} ${s.apellidoMaterno}`; }
function initials(s){ return (s.apellidoPaterno[0]+s.nombre[0]).toUpperCase(); }
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(d)} ${meses[parseInt(m)-1]} ${y}`;
}
function statusMeta(estado){
  if(estado==='al_dia') return {label:'Al día', cls:'badge-verde'};
  if(estado==='pendiente') return {label:'Pendiente', cls:'badge-ambar'};
  return {label:'Congelado', cls:'badge-hielo'};
}
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function viewFinanzas(){
  const mk = state.finMonth;
  const perCurso = CURSOS.map(c=>{
    const list = students.filter(s=>s.curso===c);
    let esperado=0, recaudado=0, pendiente=0, congelado=0;
    list.forEach(s=>{
      esperado += Number(s.montoMensual)||0;
      const st = getPago(s.id, mk).estado;
      if(st==='al_dia') recaudado += Number(s.montoMensual)||0;
      else if(st==='pendiente') pendiente += Number(s.montoMensual)||0;
      else congelado += Number(s.montoMensual)||0;
    });
    return {curso:c, count:list.length, esperado, recaudado, pendiente, congelado};
  });
  const total = perCurso.reduce((acc,c)=>({
    esperado:acc.esperado+c.esperado, recaudado:acc.recaudado+c.recaudado,
    pendiente:acc.pendiente+c.pendiente, congelado:acc.congelado+c.congelado, count:acc.count+c.count
  }), {esperado:0,recaudado:0,pendiente:0,congelado:0,count:0});
  const pctCobrado = total.esperado>0 ? Math.round((total.recaudado/total.esperado)*100) : 0;

  // last 6 months trend
  const months = [];
  for(let i=5;i>=0;i--) months.push(addMonths(currentMonthKey(), -i));
  const trend = months.map(m=>{
    let recaudado=0, pendiente=0, congelado=0, esperado=0;
    students.forEach(s=>{
      esperado += Number(s.montoMensual)||0;
      const st = getPago(s.id, m).estado;
      if(st==='al_dia') recaudado += Number(s.montoMensual)||0;
      else if(st==='pendiente') pendiente += Number(s.montoMensual)||0;
      else congelado += Number(s.montoMensual)||0;
    });
    return {m, recaudado, pendiente, congelado, esperado};
  });

  return `
    <div class="page-head">
      <div>
        <div class="eyebrow">Finanzas</div>
        <h1>Estado financiero</h1>
        <div class="sub">Resumen de pagos por curso — ${fmtMonthLabel(mk)}</div>
      </div>
      <button class="btn btn-primary" id="btnExportExcel">${ICONS.download} Exportar a Excel</button>
    </div>

    <div class="toolbar">
      <input type="month" id="finMonthInput" value="${mk}">
    </div>

    <div class="stat-grid">
      <div class="stat-card" style="--accent:var(--rojo)"><div class="lbl">Total esperado</div><div class="num" style="font-size:26px;">${fmtMoney(total.esperado)}</div></div>
      <div class="stat-card" style="--accent:var(--verde)"><div class="lbl">Recaudado (${pctCobrado}%)</div><div class="num" style="font-size:26px;">${fmtMoney(total.recaudado)}</div></div>
      <div class="stat-card" style="--accent:var(--ambar)"><div class="lbl">Pendiente</div><div class="num" style="font-size:26px;">${fmtMoney(total.pendiente)}</div></div>
      <div class="stat-card" style="--accent:var(--hielo)"><div class="lbl">Congelado</div><div class="num" style="font-size:26px;">${fmtMoney(total.congelado)}</div></div>
    </div>

    <div class="panel" style="margin-bottom:24px;">
      <h3>Por curso</h3>
      <div class="fin-table">
        <div class="fin-table-head">
          <span>Curso</span><span>Alumnos</span><span>Esperado</span><span>Recaudado</span><span>Pendiente</span><span>Congelado</span>
        </div>
        ${perCurso.map(c=>`
          <div class="fin-table-row" style="border-left:4px solid ${getCursoColor(c.curso).hex};">
            <span class="fin-curso">${escapeHtml(c.curso)}</span>
            <span>${c.count}</span>
            <span>${fmtMoney(c.esperado)}</span>
            <span style="color:var(--verde); font-weight:600;">${fmtMoney(c.recaudado)}</span>
            <span style="color:var(--ambar); font-weight:600;">${fmtMoney(c.pendiente)}</span>
            <span style="color:var(--hielo); font-weight:600;">${fmtMoney(c.congelado)}</span>
          </div>`).join('')}
        <div class="fin-table-row fin-table-total">
          <span>Total</span><span>${total.count}</span><span>${fmtMoney(total.esperado)}</span>
          <span style="color:var(--verde);">${fmtMoney(total.recaudado)}</span>
          <span style="color:var(--ambar);">${fmtMoney(total.pendiente)}</span>
          <span style="color:var(--hielo);">${fmtMoney(total.congelado)}</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>Historial · últimos 6 meses</h3>
      <div class="fin-table">
        <div class="fin-table-head">
          <span>Mes</span><span>Esperado</span><span>Recaudado</span><span>Pendiente</span><span>Congelado</span><span>% cobrado</span>
        </div>
        ${trend.map(t=>`
          <div class="fin-table-row">
            <span class="fin-curso">${fmtMonthLabel(t.m)}</span>
            <span>${fmtMoney(t.esperado)}</span>
            <span style="color:var(--verde); font-weight:600;">${fmtMoney(t.recaudado)}</span>
            <span style="color:var(--ambar); font-weight:600;">${fmtMoney(t.pendiente)}</span>
            <span style="color:var(--hielo); font-weight:600;">${fmtMoney(t.congelado)}</span>
            <span>${t.esperado>0?Math.round((t.recaudado/t.esperado)*100):0}%</span>
          </div>`).join('')}
      </div>
    </div>
  `;
}

/* ============================ RENDER ROOT ============================ */
function render(){
  renderNav();
  const main = document.getElementById('main');
  try{
    if(state.view==='dashboard') main.innerHTML = viewDashboard();
    else if(state.view==='cursos') main.innerHTML = viewCursos();
    else if(state.view==='alumnos') main.innerHTML = viewAlumnos();
    else if(state.view==='asistencia') main.innerHTML = viewAsistencia();
    else if(state.view==='encargados') main.innerHTML = viewEncargados();
    else if(state.view==='pagos') main.innerHTML = viewPagos();
    else if(state.view==='finanzas') main.innerHTML = viewFinanzas();
    else if(state.view==='usuarios') main.innerHTML = (me && me.isAdmin) ? viewUsuarios() : viewDashboard();
  } catch(err){
    console.error('Error al mostrar la vista "'+state.view+'":', err);
    main.innerHTML = `
      <div style="max-width:520px; margin:60px auto; text-align:center; padding:24px;">
        <div style="color:var(--rojo); margin-bottom:10px;">${ICONS.warn}</div>
        <h3 style="font-size:18px; margin-bottom:8px;">Ocurrió un error al mostrar esta sección</h3>
        <p style="color:var(--carbon-suave); font-size:13.5px; margin-bottom:16px;">Envía este mensaje a soporte para poder corregirlo:</p>
        <div style="background:var(--crema-2); border-radius:10px; padding:14px; text-align:left; font-family:monospace; font-size:12px; color:var(--carbon); word-break:break-word;">${escapeHtml(state.view)}: ${escapeHtml(err.message||String(err))}</div>
      </div>`;
    return;
  }
  bindViewEvents();
}

function bindViewEvents(){
  // Cursos -> open alumnos filtered
  document.querySelectorAll('[data-open-curso]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.cursoFilter = el.dataset.openCurso;
      state.view = 'alumnos';
      render();
    });
  });
  // Add / remove cursos
  const btnAddCurso = document.getElementById('btnAddCurso');
  if(btnAddCurso) btnAddCurso.addEventListener('click', openAddCursoModal);
  const btnAddCursoCard = document.getElementById('btnAddCursoCard');
  if(btnAddCursoCard) btnAddCursoCard.addEventListener('click', openAddCursoModal);
  document.querySelectorAll('[data-remove-curso]').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      confirmRemoveCurso(btn.dataset.removeCurso);
    });
  });
  // Add student
  const addBtn = document.getElementById('btnAddStudent');
  if(addBtn) addBtn.addEventListener('click', ()=>openStudentModal(null));

  // Search / filter (alumnos)
  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', e=>{ state.search = e.target.value; render(); searchInput.focus(); searchInput.selectionStart = searchInput.selectionEnd = searchInput.value.length; });
  }
  const cursoSel = document.getElementById('cursoFilterSelect');
  if(cursoSel) cursoSel.addEventListener('change', e=>{ state.cursoFilter = e.target.value; render(); });

  // Student row -> open modal
  document.querySelectorAll('[data-student]').forEach(el=>{
    el.addEventListener('click', ()=>openStudentModal(parseInt(el.dataset.student)));
  });
  document.querySelectorAll('[data-open-student]').forEach(el=>{
    el.addEventListener('click', (ev)=>{ ev.stopPropagation(); openStudentModal(parseInt(el.dataset.openStudent)); });
  });
  // Quick delete student (from list row)
  document.querySelectorAll('[data-quick-delete]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const s = students.find(x=>x.id===parseInt(el.dataset.quickDelete));
      if(s) openConfirmDeleteStudent(s);
    });
  });

  // Asistencia controls
  const attCursoSelect = document.getElementById('attCursoSelect');
  if(attCursoSelect) attCursoSelect.addEventListener('change', e=>{ state.attCurso = e.target.value; render(); });
  const attDateInput = document.getElementById('attDateInput');
  if(attDateInput) attDateInput.addEventListener('change', e=>{ state.attDate = e.target.value; render(); });
  document.querySelectorAll('[data-att]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sid = parseInt(btn.dataset.att);
      const val = btn.dataset.val === 'true';
      const key = state.attCurso+'|'+state.attDate;
      if(!attendance[key]) attendance[key] = {};
      attendance[key][sid] = val;
      queueSave({attendance: {[key]: {[sid]: val}}});
      render();
    });
  });

  // Encargados controls
  const btnAddEncargado = document.getElementById('btnAddEncargado');
  if(btnAddEncargado) btnAddEncargado.addEventListener('click', ()=>openEncargadoModal(null));
  const encDateInput = document.getElementById('encDateInput');

      setPago(sid, state.pagosMonth, patch);
      const key = sid+'|'+state.pagosMonth;
      queueSave({pagos: {[key]: pagos[key]}});
      render();
    });
  });
  document.querySelectorAll('[data-pago-fecha]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const sid = parseInt(inp.dataset.pagoFecha);
      setPago(sid, state.pagosMonth, {fechaPago: inp.value});
      const key = sid+'|'+state.pagosMonth;
      queueSave({pagos: {[key]: pagos[key]}});
    });
  });
  document.querySelectorAll('[data-pago-motivo]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const sid = parseInt(inp.dataset.pagoMotivo);
      setPago(sid, state.pagosMonth, {motivo: inp.value.trim()});
      const key = sid+'|'+state.pagosMonth;
      queueSave({pagos: {[key]: pagos[key]}});
    });
  });

  // Import Excel
  const btnImportExcel = document.getElementById('btnImportExcel');
  if(btnImportExcel) btnImportExcel.addEventListener('click', ()=>{
    document.getElementById('importFileInput').click();
  });

  // Backup controls (Inicio)
  const btnBackupDownload = document.getElementById('btnBackupDownload');
  if(btnBackupDownload) btnBackupDownload.addEventListener('click', ()=>downloadBackup());
  const btnBackupRestore = document.getElementById('btnBackupRestore');
  if(btnBackupRestore) btnBackupRestore.addEventListener('click', ()=>document.getElementById('restoreFileInput').click());

  // Finanzas controls
  const finMonthInput = document.getElementById('finMonthInput');
  if(finMonthInput) finMonthInput.addEventListener('change', e=>{ state.finMonth = e.target.value || currentMonthKey(); render(); });

  const studentCount = students.filter(s=>s.curso===curso).length;

  if(studentCount>0 || encCount>0){
    const parts = [];
    if(studentCount>0) parts.push(`${studentCount} alumno${studentCount!==1?'s':''}`);
    if(encCount>0) parts.push(`${encCount} encargado${encCount!==1?'s':''}`);
    showToast(`No se puede quitar "${curso}" — todavía tiene ${parts.join(' y ')} asignados`);
    return;

  if(CURSOS.length<=1){
    showToast('Debe quedar al menos un curso');
    return;

  openConfirm({
    title: `¿Quitar el curso "${escapeHtml(curso)}"?`,
    message: `No tiene alumnos ni encargados asignados, así que se puede quitar sin perder datos.`,
    confirmLabel: 'Sí, quitar curso',

      CURSOS = CURSOS.filter(c=>c!==curso);

      showToast('Curso eliminado');
      render();
    }
  });
}

/* ============================ IMPORT FROM EXCEL ============================ */
const CURSO_ALIASES = {
  "car noche": "CAR Noche", "carnoche": "CAR Noche",
  "car tarde": "CAR Tarde", "cartarde": "CAR Tarde",
  "ef": "EF",
  "kids": "KIDS",
};
function normalizeStr(s){
  return String(s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // strip accents
    .toLowerCase().trim().replace(/\s+/g,' ');
}
function titleCaseStr(s){
  return String(s||'').trim().split(/\s+/).map(w=> w? w[0].toUpperCase()+w.slice(1).toLowerCase() : w).join(' ');
}
function matchCursoFromSheetName(name){
  const n = normalizeStr(name);
  return CURSO_ALIASES[n] || CURSO_ALIASES[n.replace(/\s+/g,'')] || null;
}
function excelCellToISODate(val){
  if(!val) return null;
  if(val instanceof Date && !isNaN(val)) return val.toISOString().slice(0,10);
  if(typeof val === 'object' && val.result) return excelCellToISODate(val.result);
  if(typeof val === 'number'){
    // Excel serial date (days since 1899-12-30)
    const d = new Date(Math.round((val-25569)*86400*1000));
    if(!isNaN(d)) return d.toISOString().slice(0,10);
  }
  if(typeof val === 'string'){
    const d = new Date(val);
    if(!isNaN(d)) return d.toISOString().slice(0,10);
  }
  return null;
}
function cellText(val){
  if(val===null || val===undefined) return '';
  if(typeof val === 'object' && val.text) return String(val.text).trim();
  if(typeof val === 'object' && val.richText) return val.richText.map(t=>t.text).join('').trim();
  return String(val).trim();
}
function splitApellido(raw){
  const parts = String(raw||'').trim().split(/\s+/).filter(Boolean).map(titleCaseStr);
  if(parts.length===0) return {paterno:'', materno:''};
  if(parts.length===1) return {paterno:parts[0], materno:''};
  return {paterno:parts[0], materno:parts.slice(1).join(' ')};
}

const HEADER_MAP = {
  'apellido':'apellido', 'nombre':'nombre', 'fecha nacimiento':'fechaNacimiento', 'edad':'edad',
  'padre':'padre', 'wp':'wp', 'ultimo pago':'ultimoPago', 'proximo pago':'proximoPago',
  'monto a pagar':'monto', 'obs':'obs'
};

function parseSheetToStudents(worksheet, curso){
  const headerRow = worksheet.getRow(1);
  const colMap = {}; // fieldKey -> colNumber
  headerRow.eachCell((cell, colNumber)=>{
    const norm = normalizeStr(cellText(cell.value));
    if(HEADER_MAP[norm]) colMap[HEADER_MAP[norm]] = colNumber;
  });
  if(!colMap.apellido && !colMap.nombre) return []; // doesn't look like a roster sheet

  const out = [];
  const lastRow = worksheet.actualRowCount || worksheet.rowCount;
  for(let r=2; r<=lastRow; r++){
    const row = worksheet.getRow(r);
    const apellidoRaw = colMap.apellido ? cellText(row.getCell(colMap.apellido).value) : '';
    let nombreRaw = colMap.nombre ? cellText(row.getCell(colMap.nombre).value) : '';
    if(!apellidoRaw && !nombreRaw) continue; // blank row

    const {paterno, materno} = splitApellido(apellidoRaw);
    let nombre = titleCaseStr(nombreRaw);
    const combo = normalizeStr(paterno+' '+materno);
    if(combo && normalizeStr(nombre).endsWith(combo)){
      nombre = nombre.slice(0, nombre.length - combo.length).trim();
    }

    let edad = null;
    const fNacRaw = colMap.fechaNacimiento ? row.getCell(colMap.fechaNacimiento).value : null;
    const fNacIso = excelCellToISODate(fNacRaw);
    if(fNacIso){
      const b = new Date(fNacIso), t = new Date();
      edad = t.getFullYear()-b.getFullYear();
      if(t.getMonth()<b.getMonth() || (t.getMonth()===b.getMonth() && t.getDate()<b.getDate())) edad--;
    } else if(colMap.edad){
      const ev = row.getCell(colMap.edad).value;
      if(typeof ev==='number') edad = Math.floor(ev);
    }

    const padre = colMap.padre ? cellText(row.getCell(colMap.padre).value) : '';
    let wp = colMap.wp ? row.getCell(colMap.wp).value : '';
    wp = cellText(wp).replace(/\.0$/,'');
    const ultimoPagoIso = colMap.ultimoPago ? excelCellToISODate(row.getCell(colMap.ultimoPago).value) : null;
    const proximoPagoIso = colMap.proximoPago ? excelCellToISODate(row.getCell(colMap.proximoPago).value) : null;
    const montoVal = colMap.monto ? row.getCell(colMap.monto).value : 0;
    const monto = typeof montoVal === 'number' ? montoVal : (parseFloat(montoVal)||0);
    const obs = colMap.obs ? cellText(row.getCell(colMap.obs).value) : '';

    // current-month status from ULTIMO/PROXIMO PAGO — works for any month, no hardcoded column
    const obsUpper = normalizeStr(obs);
    const isInjury = obsUpper.includes('lesion');
    let pago;
    if(isInjury){
      pago = {estado:'congelado', fechaPago:null, motivo:obs};
    } else if(proximoPagoIso && proximoPagoIso > todayISO()){
      pago = {estado:'al_dia', fechaPago: ultimoPagoIso||todayISO(), motivo:''};
    } else {
      pago = {estado:'pendiente', fechaPago:null, motivo:''};
    }

    if(!paterno && !nombre) continue;

    out.push({
      nombre, apellidoPaterno:paterno, apellidoMaterno:materno,
      edad: edad!==null && !isNaN(edad) ? edad : 0,
      curso, montoMensual: monto, apoderado: titleCaseStr(padre), telefono: wp, observaciones: obs,
      _pagoActual: pago
    });
  }
  return out;
}

async function importFromWorkbookFile(file){
  const arrayBuffer = await file.arrayBuffer();
  const workbook = new ExcelJS.Workbook();
  await workbook.xlsx.load(arrayBuffer);

  let added=0, updated=0;
  const ops = []; // operaciones para el servidor (alumnos agregados / actualizados)
  const pagosTocados = {}; // solo los pagos que cambió la importación
  const skippedSheets = [];
  const touchedCursos = new Set();
  const mk = currentMonthKey();

  workbook.eachSheet(worksheet=>{
    const curso = matchCursoFromSheetName(worksheet.name);
    if(!curso){ skippedSheets.push(worksheet.name); return; }
    const parsed = parseSheetToStudents(worksheet, curso);
    if(parsed.length===0 && worksheet.name) return;
    touchedCursos.add(curso);

    parsed.forEach(sd=>{
      const key = curso+'|'+normalizeStr(sd.apellidoPaterno)+'|'+normalizeStr(sd.apellidoMaterno)+'|'+normalizeStr(sd.nombre);
      const existing = students.find(s=> (s.curso+'|'+normalizeStr(s.apellidoPaterno)+'|'+normalizeStr(s.apellidoMaterno)+'|'+normalizeStr(s.nombre)) === key );
      if(existing){
        Object.assign(existing, {
          edad: sd.edad || existing.edad, montoMensual: sd.montoMensual || existing.montoMensual,
          apoderado: sd.apoderado || existing.apoderado, telefono: sd.telefono || existing.telefono,
          observaciones: sd.observaciones || existing.observaciones
        });
        setPago(existing.id, mk, sd._pagoActual);
        pagosTocados[existing.id+'|'+mk] = pagos[existing.id+'|'+mk];
        ops.push({op:'update', item: existing});
        updated++;
      } else {
        const id = newId(students);
        const nuevo = {
          id, nombre:sd.nombre, apellidoPaterno:sd.apellidoPaterno, apellidoMaterno:sd.apellidoMaterno,
          edad:sd.edad, curso:sd.curso, montoMensual:sd.montoMensual, becaPorcentaje:0,
          apoderado:sd.apoderado, telefono:sd.telefono, observaciones:sd.observaciones
        };
        students.push(nuevo);
        ops.push({op:'add', item: nuevo});
        setPago(id, mk, sd._pagoActual);
        pagosTocados[id+'|'+mk] = pagos[id+'|'+mk];
        added++;
      }
    });
  });

  return {added, updated, skippedSheets, touchedCursos:[...touchedCursos], ops, pagosTocados};
}

/* ============================ EXPORT TO EXCEL ============================ */
async function exportExcel(){
  const btn = document.getElementById('btnExportExcel');
  if(btn){ btn.disabled = true; btn.textContent = 'Generando...'; }
  try{
    const workbook = new ExcelJS.Workbook();
    workbook.creator = 'GoPro Soccer Club';
    workbook.created = new Date();

    const HEADER_FILL = { type:'pattern', pattern:'solid', fgColor:{argb:'FF37312F'} };
    const HEADER_FONT = { color:{argb:'FFFAF7F2'}, bold:true };
    const TOTAL_FILL = { type:'pattern', pattern:'solid', fgColor:{argb:'FFF1ECE3'} };

    /* ---- Sheet 1: Alumnos ---- */
    const wsA = workbook.addWorksheet('Alumnos');
    wsA.columns = [
      {header:'Apellido Paterno', key:'apP', width:18},
      {header:'Apellido Materno', key:'apM', width:18},
      {header:'Nombre(s)', key:'nom', width:16},
      {header:'Edad', key:'edad', width:8},
      {header:'Curso', key:'curso', width:14},
      {header:'Monto mensual (Bs)', key:'monto', width:16},
      {header:'Beca (%)', key:'beca', width:10},
      {header:'Apoderado', key:'apoderado', width:24},
      {header:'Teléfono / WhatsApp', key:'telefono', width:18},
      {header:'Estado ('+fmtMonthLabel(currentMonthKey())+')', key:'estado', width:16},
      {header:'Fecha de pago', key:'fecha', width:14},
      {header:'Motivo congelamiento', key:'motivo', width:26},
      {header:'Observaciones', key:'obs', width:30},
    ];
    wsA.getRow(1).eachCell(cell=>{ cell.fill = HEADER_FILL; cell.font = HEADER_FONT; });

    const mkNow = currentMonthKey();
    sortStudents(students).forEach(s=>{
      const p = getPago(s.id, mkNow);
      const row = wsA.addRow({
        apP: s.apellidoPaterno, apM: s.apellidoMaterno, nom: s.nombre, edad: s.edad, curso: s.curso,
        monto: Number(s.montoMensual)||0, beca: s.becaPorcentaje||0,
        apoderado: s.apoderado||'', telefono: s.telefono||'',
        estado: statusMeta(p.estado).label, fecha: p.fechaPago?fmtDate(p.fechaPago):'—',
        motivo: p.estado==='congelado'?(p.motivo||''):'', obs: s.observaciones||''
      });
      const color = getCursoColor(s.curso);
      if(color){
        row.eachCell(cell=>{ cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:color.fillArgb}}; });
      }
    });

    /* ---- Sheet 2: Estado Financiero ---- */
    const wsF = workbook.addWorksheet('Estado Financiero');
    const mk = state.finMonth || currentMonthKey();
    wsF.addRow(['Estado financiero — ' + fmtMonthLabel(mk)]);
    wsF.getCell('A1').font = { bold:true, size:14 };
    wsF.addRow([]);
    const headerRowIdx = 3;
    wsF.getRow(headerRowIdx).values = ['Curso','Alumnos','Esperado (Bs)','Recaudado (Bs)','Pendiente (Bs)','Congelado (Bs)','% cobrado'];
    wsF.getRow(headerRowIdx).eachCell(cell=>{ cell.fill = HEADER_FILL; cell.font = HEADER_FONT; });
    wsF.columns = [
      {key:'curso', width:16},{key:'count', width:10},{key:'esperado', width:16},
      {key:'recaudado', width:16},{key:'pendiente', width:16},{key:'congelado', width:16},{key:'pct', width:10}
    ];

    const totals = {esperado:0, recaudado:0, pendiente:0, congelado:0, count:0};
    CURSOS.forEach(c=>{
      const list = students.filter(s=>s.curso===c);
      let esperado=0, recaudado=0, pendiente=0, congelado=0;
      list.forEach(s=>{
        esperado += Number(s.montoMensual)||0;
        const st = getPago(s.id, mk).estado;
        if(st==='al_dia') recaudado += Number(s.montoMensual)||0;
        else if(st==='pendiente') pendiente += Number(s.montoMensual)||0;
        else congelado += Number(s.montoMensual)||0;
      });
      const pct = esperado>0 ? Math.round((recaudado/esperado)*100) : 0;
      const row = wsF.addRow([c, list.length, esperado, recaudado, pendiente, congelado, pct+'%']);
      const color = getCursoColor(c);
      row.eachCell(cell=>{ cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:color.fillArgb}}; });
      totals.esperado+=esperado; totals.recaudado+=recaudado; totals.pendiente+=pendiente; totals.congelado+=congelado; totals.count+=list.length;
    });
    const pctTotal = totals.esperado>0 ? Math.round((totals.recaudado/totals.esperado)*100) : 0;
    const totalRow = wsF.addRow(['TOTAL', totals.count, totals.esperado, totals.recaudado, totals.pendiente, totals.congelado, pctTotal+'%']);
    totalRow.eachCell(cell=>{ cell.fill = TOTAL_FILL; cell.font = {bold:true}; });

    /* ---- Sheet 3: Asistencia Alumnos ---- */
    const wsAA = workbook.addWorksheet('Asistencia Alumnos');
    let rowAA = 1;
    CURSOS.forEach(c=>{
      const cursoStudents = sortStudents(students.filter(s=>s.curso===c));
      const dateKeys = [...new Set(Object.keys(attendance).filter(k=>k.startsWith(c+'|')).map(k=>k.slice(c.length+1)))].sort();
      if(cursoStudents.length===0 && dateKeys.length===0) return;

      wsAA.getRow(rowAA).getCell(1).value = c;
      wsAA.getRow(rowAA).getCell(1).font = {bold:true, size:13};
      rowAA++;

      if(dateKeys.length===0){
        wsAA.getRow(rowAA).getCell(1).value = 'Sin asistencia registrada para este curso.';
        wsAA.getRow(rowAA).getCell(1).font = {italic:true, color:{argb:'FF8A817D'}};
        rowAA += 2;
        return;
      }

      const headAA = wsAA.getRow(rowAA);
      headAA.getCell(1).value = 'Alumno';
      dateKeys.forEach((d,i)=>{ headAA.getCell(2+i).value = fmtDate(d); });
      headAA.eachCell(cell=>{ cell.fill = HEADER_FILL; cell.font = HEADER_FONT; });
      rowAA++;

      const color = getCursoColor(c);
      cursoStudents.forEach(s=>{
        const dataRow = wsAA.getRow(rowAA);
        dataRow.getCell(1).value = fullName(s);
        dateKeys.forEach((d,i)=>{
          const rec = attendance[c+'|'+d];
          const val = rec ? rec[s.id] : undefined;
          dataRow.getCell(2+i).value = val===true ? 'Presente' : (val===false ? 'Ausente' : '—');
        });
        dataRow.eachCell(cell=>{ cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:color.fillArgb}}; });
        rowAA++;
      });
      rowAA += 2;
    });
    wsAA.getColumn(1).width = 28;
    for(let i=2;i<=40;i++){ wsAA.getColumn(i).width = 12; }

    /* ---- Sheet 4: Asistencia Encargados ---- */
    const wsAE = workbook.addWorksheet('Asistencia Encargados');
    let rowAE = 1;
    CURSOS.forEach(c=>{
      const cursoEncargados = encargados.filter(e=>e.cursos.includes(c)).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
      const dateKeys = [...new Set(Object.keys(encargadoAttendance)
        .filter(k=>{ const parts=k.split('|'); return parts[1]===c; })
        .map(k=>k.split('|')[2])
      )].sort();
      if(cursoEncargados.length===0 && dateKeys.length===0) return;

      wsAE.getRow(rowAE).getCell(1).value = c;
      wsAE.getRow(rowAE).getCell(1).font = {bold:true, size:13};
      rowAE++;

      if(dateKeys.length===0){
        wsAE.getRow(rowAE).getCell(1).value = 'Sin asistencia registrada para este curso.';
        wsAE.getRow(rowAE).getCell(1).font = {italic:true, color:{argb:'FF8A817D'}};
        rowAE += 2;
        return;
      }

      const headAE = wsAE.getRow(rowAE);
      headAE.getCell(1).value = 'Encargado';
      dateKeys.forEach((d,i)=>{ headAE.getCell(2+i).value = fmtDate(d); });
      headAE.eachCell(cell=>{ cell.fill = HEADER_FILL; cell.font = HEADER_FONT; });
      rowAE++;

      const colorE = getCursoColor(c);
      cursoEncargados.forEach(enc=>{
        const dataRow = wsAE.getRow(rowAE);
        dataRow.getCell(1).value = enc.nombre;
        dateKeys.forEach((d,i)=>{
          const val = encargadoAttendance[enc.id+'|'+c+'|'+d];
          dataRow.getCell(2+i).value = val===true ? 'Presente' : (val===false ? 'Ausente' : '—');
        });
        dataRow.eachCell(cell=>{ cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:colorE.fillArgb}}; });
        rowAE++;
      });
      rowAE += 2;
    });
    wsAE.getColumn(1).width = 28;
    for(let i=2;i<=40;i++){ wsAE.getColumn(i).width = 12; }

    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const filename = `gopro-soccer-club_${mk}.xlsx`;

    const ok = await saveBlobFile(blob, filename);
    if(ok) showToast('Excel descargado correctamente');
  } catch(err){
    if(err && err.code === 'declined'){
      // viewer cancelled the save — not an error
    } else {
      console.error('Error al exportar Excel:', err);
      showToast('No se pudo generar el Excel');
    }
  } finally {
    if(btn){ btn.disabled = false; btn.innerHTML = ICONS.download + ' Exportar a Excel'; }
  }
}

function openFormModal({title, intro, fields, submitLabel, onSubmit}){
  const backdrop = document.getElementById('studentModalBackdrop');
  const modal = document.getElementById('studentModal');
  modal.innerHTML = `
    <div class="modal-head"><h3>${title}</h3><button class="modal-close" id="fmClose" type="button">${ICONS.x}</button></div>
    <div class="modal-body">
      ${intro ? `<p style="color:var(--carbon-suave); font-size:13.5px; margin:0 0 14px; line-height:1.5;">${intro}</p>` : ''}
      ${fields.map(f=>`
        <div class="field"><label>${f.label}</label>
          <input id="fm_${f.id}" type="${f.type||'text'}" autocomplete="${f.autocomplete||'off'}" ${f.noCaps?'autocapitalize="none" spellcheck="false"':''} placeholder="${escapeHtml(f.placeholder||'')}">
        </div>`).join('')}
      <div id="fmError" style="color:var(--rojo-oscuro); font-size:13px; min-height:18px;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="fmCancel" type="button">Cancelar</button>
      <button class="btn btn-primary" id="fmSubmit" type="button">${submitLabel}</button>
    </div>`;
  const close = ()=>backdrop.classList.remove('open');
  const errEl = document.getElementById('fmError');
  const btn = document.getElementById('fmSubmit');
  const submit = async ()=>{
    const values = {};
    fields.forEach(f=>{ values[f.id] = document.getElementById('fm_'+f.id).value; });
    errEl.textContent = '';
    btn.disabled = true;
    try{
      await onSubmit(values);
      close();
    } catch(err){
      errEl.textContent = err.message || 'No se pudo completar la acción';
    } finally {
      btn.disabled = false;
    }
  };
  document.getElementById('fmClose').addEventListener('click', close);
  document.getElementById('fmCancel').addEventListener('click', close);
  btn.addEventListener('click', submit);
  fields.forEach(f=>document.getElementById('fm_'+f.id).addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); }));
  backdrop.classList.add('open');
  const first = document.getElementById('fm_'+fields[0].id);
  if(first && first.focus) first.focus();
}

function showAuth(){
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appShell').style.display = 'none';
}
function showAppShell(){
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
}
function setAuthMode(mode){
  document.getElementById('loginForm').style.display = mode==='login' ? 'flex' : 'none';
  document.getElementById('setupForm').style.display = mode==='setup' ? 'flex' : 'none';
}
function setLoginError(msg){ document.getElementById('loginError').textContent = msg || ''; }
function setSetupError(msg){ document.getElementById('setupError').textContent = msg || ''; }

function onSessionExpired(){
  if(expiredShown || !me) return;
  expiredShown = true;
  me = null;
  clearInterval(pollTimer);
  showAuth();
  setAuthMode('login');
  setLoginError('Tu sesión terminó. Escribe tu usuario y contraseña para continuar.');
}

async function doLogout(){
  try{ await api('/api/logout', {method:'POST', body:{}, noExpire:true}); } catch(e){ /* igual cerramos */ }
  location.reload();
}

function renderUserBox(){
  const el = document.getElementById('userBoxName');
  if(el) el.textContent = me ? ((me.nombre || me.usuario) + (me.isAdmin ? ' · Administrador' : '')) : '';
}

// Cada 30 s revisa si la otra persona guardó algo nuevo (sin molestar si estás escribiendo)
function userIsBusy(){
  const modalOpen = ['studentModalBackdrop','confirmBackdrop'].some(id=>document.getElementById(id).classList.contains('open'));
  const a = document.activeElement;
  const typing = a && ['INPUT','TEXTAREA','SELECT'].includes(a.tagName);
  return modalOpen || typing;
}
async function pollChanges(){
  if(!me || document.hidden || saving || Object.keys(pendingPatch).length || userIsBusy()) return;
  try{
    const r = await api('/api/data?v=' + encodeURIComponent(dataVersion || ''));
    if(r.unchanged) return;
    if(r.exists && r.state){
      applyState(r.state);
      dataVersion = r.version;
      render();
    }
  } catch(err){ /* sin conexión: se intenta de nuevo en el siguiente ciclo */ }
}

async function startApp(){
  showAppShell();
  expiredShown = false;
  renderUserBox();
  document.getElementById('main').innerHTML = `
    <div style="display:flex; align-items:center; justify-content:center; height:60vh; flex-direction:column; gap:14px;">
      <div style="width:40px;height:40px;border:3px solid var(--linea);border-top-color:var(--rojo);border-radius:50%;animation:spin .8s linear infinite;"></div>
      <div class="eyebrow">Cargando tus datos...</div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  `;
  try{
    await loadData();
  } catch(err){
    if(err.status === 401) return; // onSessionExpired ya mostró el acceso
    document.getElementById('main').innerHTML = `
      <div style="max-width:420px; margin:60px auto; text-align:center; padding:24px;">
        <h3 style="font-size:18px; margin-bottom:8px;">No se pudieron cargar los datos</h3>
        <p style="color:var(--carbon-suave); font-size:13.5px; margin-bottom:16px;">${escapeHtml(err.message)}</p>
        <button class="btn btn-primary" id="btnRetryLoad">Reintentar</button>
      </div>`;
    document.getElementById('btnRetryLoad').addEventListener('click', startApp);
    return;
  }
  render();
  clearInterval(pollTimer);
  pollTimer = setInterval(pollChanges, 30000);
}

function bindAuthForms(){
  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const usuario = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    const btn = document.getElementById('loginBtn');
    setLoginError('');
    btn.disabled = true;
    try{
      await api('/api/login', {method:'POST', body:{usuario, password}, noExpire:true});
      try{
        me = await api('/api/me', {noExpire:true});
      } catch(err){
        setLoginError('No se pudo mantener la sesión. Revisa que el navegador permita cookies para este sitio.');
        return;
      }
      document.getElementById('loginPass').value = '';
      await startApp();
    } catch(err){
      setLoginError(err.status === 401 ? 'Usuario o contraseña incorrectos'
                  : err.network ? 'No se pudo conectar con el servidor. Revisa tu conexión.'
                  : err.message);
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('setupForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const codigo = document.getElementById('setupToken').value;
    const usuario = document.getElementById('setupUser').value.trim();
    const password = document.getElementById('setupPass').value;
    const password2 = document.getElementById('setupPass2').value;
    const btn = document.getElementById('setupBtn');
    setSetupError('');
    if(password !== password2){ setSetupError('Las contraseñas no coinciden'); return; }
    btn.disabled = true;
    try{
      await api('/api/setup', {method:'POST', body:{codigo, usuario, password}, noExpire:true});
      history.replaceState(null, '', location.pathname);
      document.getElementById('setupToken').value = '';
      document.getElementById('setupPass').value = '';
      document.getElementById('setupPass2').value = '';
      document.getElementById('loginUser').value = usuario;
      setAuthMode('login');
      setLoginError('Administrador listo. Ya puedes entrar con tu usuario y contraseña.');
    } catch(err){
      setSetupError(err.status === 404 ? 'La configuración inicial no está activa.' : err.message);
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('btnLogout').addEventListener('click', doLogout);
  document.getElementById('btnMyPassword').addEventListener('click', openMyPasswordModal);
}

// Avisa si intentas cerrar la pestaña con cambios sin guardar
window.addEventListener('beforeunload', (e)=>{
  if(Object.keys(pendingPatch).length || saving){ e.preventDefault(); e.returnValue = ''; }
});

/* ============================ ARRANQUE ============================ */
(async function boot(){
  const sideLogo = document.querySelector('.sidebar-brand img');
  if(sideLogo) document.getElementById('authLogo').src = sideLogo.src;
  bindAuthForms();
  if(/[?&]configurar(\b|=|&|$)/.test(location.search)){
    setAuthMode('setup');
    showAuth();
    return;
  }
  setAuthMode('login');
  try{
    me = await api('/api/me', {noExpire:true});
  } catch(err){
    showAuth();
    if(err.status !== 401) setLoginError('No se pudo conectar con el servidor. Revisa tu conexión.');
    return;
  }
  await startApp();
})();
</script>
</body>
</html>
